[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvark"
version = "0.12.0"
description = "Python client for the Anthive REST API: single-cell, bulk and spatial transcriptomics datasets, plots, facet tests, papers and analysis artefacts"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mark Fiers", email = "mark.fiers@kuleuven.be" },
]
maintainers = [
    { name = "Mark Fiers", email = "mark.fiers@kuleuven.be" },
]
keywords = [
    "anthive",
    "bioinformatics",
    "single-cell",
    "scrna-seq",
    "transcriptomics",
    "microglia",
    "rest-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3.0"]
# Reuse credentials stored by the Go vark CLI (`~/.config/vark/`):
# pyrage decrypts secrets.age (X25519 / age), PyYAML reads config.yaml.
vark-config = [
    "pyrage>=1.0",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pandas>=1.3.0",
    "pyrage>=1.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage      = "https://gitlab.kuleuven.be/bdslab/anthive/pyvark"
Source        = "https://gitlab.kuleuven.be/bdslab/anthive/pyvark"
Mirror        = "https://codeberg.org/mfiers/pyvark"
Issues        = "https://codeberg.org/mfiers/pyvark/issues"
Changelog     = "https://gitlab.kuleuven.be/bdslab/anthive/pyvark/-/blob/main/CHANGELOG.md"
"Go CLI"      = "https://codeberg.org/mfiers/vark"

[tool.setuptools]
packages = ["vark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
